[project]
name = "flatex-terminal"
version = "0.1.0"
description = "Inoffizielles Auswertungstool für ein flatex.at-Depot: schonender Abruf, lokale Datenbank, Web-App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
web = ["pandas>=2.2", "yfinance>=0.2.50", "fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
flatex = "flatex.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flatex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
